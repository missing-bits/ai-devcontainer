min_version = "2026.9.15"

[tools]
node = "24.21.0"
"npm:@devcontainers/cli" = "0.89.0"
jq = "1.8.2"
bats = "1.14.0"
shellcheck = "0.11.0"
shfmt = "3.14.1"
usage = "6.11.1"
# Agent CLIs for working on this repository; latest by developer decision.
"aqua:anthropics/claude-code" = "latest"
"aqua:openai/codex" = "latest"

[task_config]
includes = ["tasks/host"]

[tasks.fmt]
description = "Format shell sources"
shell = "bash -c"
run = "set -o pipefail; tools/shell-files.sh | xargs -0 -r shfmt -w"

[tasks."fmt:check"]
description = "Check shell formatting"
shell = "bash -c"
run = "set -o pipefail; tools/shell-files.sh | xargs -0 -r shfmt -d"

[tasks.lint]
description = "Lint shell sources"
shell = "bash -c"
run = "set -o pipefail; tools/shell-files.sh | grep -zv '\\.bats$' | xargs -0 -r shellcheck -x"

[tasks.test]
description = "Run unit tests (no Docker, no credentials)"
run = "bats --recursive tests/unit"

[tasks."test:integration"]
description = "Run integration tests; fails when Docker is unavailable"
run = "docker info >/dev/null 2>&1 || { echo 'test:integration requires a running Docker engine' >&2; exit 1; }; bats --recursive tests/integration"

[tasks.check]
description = "Formatting, lint, and unit tests"
depends = ["fmt:check", "lint", "test"]
